name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert taplo installed with default version
        run: |
          if [ ! -x /usr/local/bin/taplo ]; then
            echo "FAIL: /usr/local/bin/taplo not found or not executable"
            exit 1
          fi
          OUT="$(taplo --version 2>&1)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "0.8.1"; then
            echo "FAIL: expected version 0.8.1"
            exit 1
          fi
          echo "PASS"
