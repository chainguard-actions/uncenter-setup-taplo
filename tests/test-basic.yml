name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert taplo installed at default version
        run: |
          if ! command -v taplo >/dev/null 2>&1; then
            echo "FAIL: taplo not found on PATH"
            exit 1
          fi
          echo "location: $(command -v taplo)"
          if [ ! -x /usr/local/bin/taplo ]; then
            echo "FAIL: /usr/local/bin/taplo missing or not executable"
            exit 1
          fi
          VERSION="$(taplo --version 2>&1)"
          echo "actual: $VERSION"
          if ! echo "$VERSION" | grep -q "0.8.1"; then
            echo "FAIL: expected version 0.8.1"
            exit 1
          fi
          echo "PASS"
