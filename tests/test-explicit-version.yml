name: Test explicit version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.8.1"
      - name: Assert requested version installed
        run: |
          VERSION="$(taplo --version 2>&1)"
          echo "actual: $VERSION"
          if ! echo "$VERSION" | grep -qi "taplo"; then
            echo "FAIL: taplo --version output unexpected"
            exit 1
          fi
          if ! echo "$VERSION" | grep -q "0.8.1"; then
            echo "FAIL: expected version 0.8.1"
            exit 1
          fi
          echo "PASS"
