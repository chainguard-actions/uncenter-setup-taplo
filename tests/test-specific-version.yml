name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "0.9.3"
      - name: Assert taplo installed with requested version
        run: |
          OUT="$(/usr/local/bin/taplo --version 2>&1)"
          echo "actual: $OUT"
          if ! echo "$OUT" | grep -q "0.9.3"; then
            echo "FAIL: expected version 0.9.3"
            exit 1
          fi
          echo "PASS"
