name: "Setup Taplo"
description: "Install the Taplo CLI"
inputs:
  version:
    description: Version of Taplo to install
    required: false
    default: "0.8.1"
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Install Taplo
      shell: bash
      env:
        TAPLO_RUNNER_OS: ${{ runner.os }}
        TAPLO_RUNNER_ARCH: ${{ runner.arch }}
        TAPLO_VERSION: ${{ inputs.version }}
      run: |
        SUDO="sudo"
        LOCATION="/usr/local/bin/taplo"

        case "$TAPLO_RUNNER_OS" in
          "Linux")
            RUNNER_OS="linux"
            ;;
          "Windows")
            RUNNER_OS="windows"
            SUDO=""
            LOCATION="C:\\Program Files\\taplo\\bin\\taplo.exe"
            mkdir -p "C:\\Program Files\\taplo\\bin\\"
            ;;
          "macOS")
            RUNNER_OS="darwin"
            ;;
        esac
        case "$TAPLO_RUNNER_ARCH" in
          "X86" | "X64")
            RUNNER_ARCH="x86_64"
            ;;
          "ARM64")
            RUNNER_ARCH="aarch64"
            ;;
          *)
            echo "Unsupported architecture"
            exit 1
            ;;
        esac
        curl -Ls "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/taplo-full-${RUNNER_OS}-${RUNNER_ARCH}.gz" | \
        gzip -d > taplo && \
        chmod +x taplo && \
        ${SUDO} mv taplo "${LOCATION}"
